<!DOCTYPE html>
<html len="en">
    <head>
        <title>
            List Examples
        </title>
    </head>
    <body>
        <h1> List example programs </h1>
        <!--ordered list program-->
        Hobbies:
        <ol>
            <li> Playing cricket </li>
            <li> Practice coding </li>
        </ol>
        <br/><br/>
        <!--unordered list program-->
        HTML Books:
        <ul type="disc">
            <li> Book 1 </li>
            <li> Book 2 </li>
        </ul>
        <br/><br/>
        <!--Description list program-->
        <dl>
            <dt> HTML </dt>
            <dd> It is used for to create wedpage </dd>
            <dt> XML </dt>
            <dd> It  is used for to store data </dd>
        </dl>

    </body>
</html>
